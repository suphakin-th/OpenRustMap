[package]
name = "base"
version = "0.1.0"
edition = "2021"

[features]
default = []
gdal-support = ["gdal"]
lidar-support = ["las"]

[dependencies]

# Async utilities - MIT/Apache-2.0
async-trait = "0.1"
clap = { version = "4.4", features = ["derive"] }
config = { version = "0.13.2", default-features = false, features = ["toml"] }
futures = "0.3"

# Geospatial processing - All open source
# Bumped from 0.16 (original) to 0.19 -- 0.16's bundled gdal-sys 0.9 only
# ships pre-built bindings up to older GDAL versions and panics at build
# time against the GDAL 3.10.3 this project's Docker build environment
# actually has (`apt install libgdal-dev` on Debian trixie). gdal 0.19's
# gdal-sys ships pre-built bindings for GDAL 3.8-3.13, covering 3.10.3
# without needing the bindgen feature (which would require libclang
# installed everywhere this ever builds -- a much heavier, more fragile
# requirement to carry long-term versus just tracking a current release).
#
# gdal-sys is NOT pinned separately here -- it's a transitive dependency
# `gdal` already manages (via cargo's `links = "gdal"` native-library
# uniqueness rule, only one version can exist in the graph at all), and an
# explicit pin here previously caused `cargo build` to fail outright with
# a version-resolution conflict against whatever gdal-sys version 0.19
# actually wants.
gdal = { version = "0.19", optional = true }
geo = "0.26"
geo-types = "0.7"
geojson = "0.24"
hashbrown = "0.14"
indicatif = "0.17"

# Lidar support (future) - MIT/Apache-2.0
las = { version = "0.8", optional = true }
nonempty = "0.9.0"
num-traits = "0.2.18"
osm-pbf = "0.3.3"
osmpbfreader = "0.16.0"
petgraph = "0.6"
rayon = "1.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snafu = "^0.7.3"

# Database (sqlx for migrations and queries) - MIT/Apache-2.0
# "sqlite" backs the embedded snapshot store (db::sqlite_snapshot) — additive
# alongside "postgres", which stays for the existing PostGIS-backed pool/loaders.
sqlx = { version = "0.7", features = ["postgres", "sqlite", "runtime-tokio-rustls", "migrate", "time", "json", "uuid"] }
time = { version = "^0.3", features = ["serde"] }
tokio = { version = "1.20.2", features = ["full", "tracing"] }
tokio-postgres = { version = "0.7.7", features = ["with-serde_json-1", "with-time-0_3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["json"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
